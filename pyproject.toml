[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
dynamic = ["version"]
description = "Market data, trade journal and prediction tools for the Crypto Sentinel agent"
readme = "README.md"
requires-python = ">=3.12"
# Core: what both EC2 and Lambda need. Keep it light, it ends up in the Lambda zip.
dependencies = [
    "requests>=2.32",
    "urllib3>=2",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Libraries are added to an extra when the first module uses them (see docs/IMPLEMENTATION_PLAN.md, section 3).
ec2 = [
    "anthropic>=2.3",
    "boto3>=1.35",
    "click>=8.1",
    "feedparser>=6.0.14",
    "google-genai>=2.33",
    # Imported for their network errors (the Gemini SDK runs on either), not only pulled in.
    "httpx>=0.28",
    "httpx2>=2.16",
    "python-ulid>=3",
    "pyyaml>=6.0",
]
# boto3 is part of the Lambda runtime, so nothing beyond the core yet.
lambda = []
dev = [
    "sentinel[ec2]",
    "pytest>=8.3",
    "moto[ssm,dynamodb,s3]>=5.0",
    "ruff>=0.8",
    # Reference for the plain-Python Naive Bayes and logistic regression (tests/test_nb.py).
    "scikit-learn>=1.5",
    # Statistical tests of the research scripts (analysis/).
    "scipy>=1.13",
]

[project.scripts]
sentinel = "sentinel.cli:cli"

[tool.setuptools.dynamic]
version = { attr = "sentinel.__version__" }

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.setuptools.package-data]
"sentinel.llm" = ["prompts/*.md"]

[tool.ruff]
target-version = "py312"
line-length = 100
# Old scripts stay as they are until they are ported (task 1.2).
extend-exclude = ["openclaw", "legacy"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not live'"
markers = [
    "live: smoke test against a real external API (opt-in: pytest -m live)",
]
